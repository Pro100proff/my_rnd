version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:3.7
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"

  spark-master:
    image: bitnami/spark:3.5
    environment:
      SPARK_MODE: master
    ports:
      - "7077:7077"
      - "8080:8080"

  spark-worker:
    image: bitnami/spark:3.5
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
    ports:
      - "8081:8081"

  archive-maintenance:
    build:
      context: .
      dockerfile: docker/archive-maintenance/Dockerfile
    depends_on:
      - kafka
      - postgres
      - spark-master
    command: >
      spark-submit
      --master spark://spark-master:7077
      --conf spark.sql.orc.compression.codec=zstd
      --class com.platform.archive.maintenance.ArchiveMaintenanceJob
      /opt/app/archive-maintenance.jar
      --kafka-brokers kafka:9092
      --merge-events-topic merge-events
      --pg-jdbc jdbc:postgresql://postgres:5432/platform
      --pg-user platform
      --pg-password secret
